:root{--C:480px;--s:1;--f-ui:"CW Oswald","Oswald","Arial Narrow",sans-serif;--f-dig:"CW Orbitron","Orbitron",ui-monospace,monospace;--f-horror:"CW Butcher",Impact,serif;--f-lucky:"CW Lucky","Arial Black",sans-serif;
 --dial1:#1d4fb8;--dial2:#0b1f5c;--acc:#e8262d;--acc2:#ffd400;--txt:#fff;--bez1:#c81e24;--bez2:#7c0c10;--bezTxt:#fff3d6;--glow:#ffcc00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07060a;color:#fff;font-family:var(--f-ui);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#2a1a2e 0%,#120a14 45%,#050307 100%);transition:background 1s}
#bg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px),radial-gradient(circle at 20% 80%,rgba(232,38,45,.12),transparent 40%),radial-gradient(circle at 80% 20%,rgba(40,90,220,.14),transparent 45%)}
body.evil #bg{background:radial-gradient(ellipse at 50% 40%,#3a0808 0%,#160404 50%,#050101 100%)}
body.style-bride #bg{background:radial-gradient(ellipse at 50% 40%,#3a1030 0%,#170612 50%,#060205 100%)}
body.style-hack #bg{background:radial-gradient(ellipse at 50% 40%,#0e1f40 0%,#060c1c 50%,#020308 100%)}
body.style-voodoo #bg{background:radial-gradient(ellipse at 50% 40%,#231036 0%,#0d0616 50%,#030106 100%)}
#bgFlash{position:fixed;inset:0;background:#dfe8ff;opacity:0;pointer-events:none;mix-blend-mode:screen;z-index:5}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.watch{position:relative;width:var(--C);height:var(--C);z-index:2;filter:drop-shadow(0 calc(var(--C)*.05) calc(var(--C)*.06) rgba(0,0,0,.75))}
.case{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.strap{position:absolute;left:50%;width:calc(var(--C)*.36);transform:translateX(-50%);z-index:1;
 background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 12%,rgba(255,255,255,.06) 50%,rgba(0,0,0,0) 88%,rgba(0,0,0,.55)),repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.18) 0 1px,transparent 1px 4px),linear-gradient(#2f5fa0,#23497e);
 box-shadow:inset 0 0 0 calc(var(--C)*.012) #1c3a66}
.strap::before,.strap::after{content:"";position:absolute;top:0;bottom:0;width:0;border-left:calc(var(--C)*.005) dashed #f0a23a}
.strap::before{left:calc(var(--C)*.03)}.strap::after{right:calc(var(--C)*.03)}
.strap.top{bottom:calc(50% + var(--C)*.44);height:60vh;border-radius:calc(var(--C)*.03) calc(var(--C)*.03) 0 0}

/* settings */
const TOGS=[['digital','Digital time'],['h24','24-hour'],['scares','Jump scares'],['sound','Sound'],['voice','Chucky voice'],['haptics','Haptics'],['texts','Chucky texts'],['witching','Witching hour (12 & 3 AM)']];
BUILD.settings=(b)=>{b.classList.add('scroll');b.innerHTML=`<div class="lbl">Watch face</div><div class="row" id="swatches">${STYLES.map(s=>`<div class="sw" data-s="${s.id}" title="${s.name}" style="background:${s.sw}"></div>`).join('')}</div><div id="styleName" style="font-size:13px;margin-top:-2px"></div>
 <div class="list">${TOGS.map(([k,l])=>`<div class="li"><span style="flex:1">${l}</span><button class="tog" data-k="${k}"></button></div>`).join('')}
 <div class="li"><span style="flex:1">Volume</span><input type="range" id="vol" min="0" max="1" step=".05" style="width:90px" data-noswipe></div></div>
 <div class="lbl" style="margin-top:4px">Secret code</div><div class="row" style="width:100%;flex-wrap:nowrap"><input class="txt" id="code" maxlength="20" placeholder="Type a secret word…" autocomplete="off"><button class="btn sm yel" id="codeGo">Go</button></div><div class="lbl" id="secCount" style="font-size:11px"></div>
 <button class="btn sm red" id="testScare">Test jump scare</button><button class="btn sm" id="resetAll">Reset everything</button><div class="lbl" style="font-size:10px;line-height:1.4;padding:0 8px 20px">Unofficial fan-made toy. Original art & sounds. Chucky & Child's Play belong to their owners.</div>`;
 $('#swatches').onclick=e=>{const s=e.target.closest('.sw');if(!s)return;setStyle(s.dataset.s);SFX.tap();};
 b.querySelectorAll('.tog').forEach(t=>t.onclick=()=>{const k=t.dataset.k;ST[k]=!ST[k];save();SFX.tap();applySettings();if(k==='scares'&&ST.scares)say("Oh, now we're talking. Heh heh.");if(k==='voice'&&!ST.voice&&'speechSynthesis' in window)speechSynthesis.cancel();});
 $('#vol').value=ST.vol;$('#vol').oninput=e=>{ST.vol=+e.target.value;if(master)master.gain.value=ST.vol;save();};
 const go_=()=>{const v=$('#code').value;$('#code').value='';if(!checkCode(v))toast('Nope. Wrong code, pal.',{save:false});};$('#codeGo').onclick=go_;$('#code').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')go_();});
 $('#testScare').onclick=()=>jumpScare();$('#resetAll').onclick=()=>{if(confirm('Reset all Chucky Watch data?')){localStorage.removeItem(LS);location.reload();}};applySettings();};
function setStyle(id){ST.style=id;save();applySettings();const s=STYLES.find(x=>x.id===id);if(id==='bride')say("Tiffany, baby! Till death do us part!");else if(id==='evil')say("Now THIS is more like it.",{evil:true});else if(id==='voodoo')say("Ade due Damballa...",{evil:true});else if(id==='hack')say("Hackensack. Home sweet home.");else say("Hi! I'm your friend to the end!",{evil:false});}
function applySettings(){const s=STYLES.find(x=>x.id===ST.style)||STYLES[0];document.body.className=document.body.className.replace(/style-\S+/g,'').trim()+' style-'+s.id;for(const k in s.vars)document.documentElement.style.setProperty(k,s.vars[k]);
 $('#bezTxtTop textPath').textContent=s.bez[0];$('#bezTxtBot textPath').textContent=s.bez[1];document.body.classList.toggle('digital',ST.digital);
 $$('.tog[data-k]').forEach(t=>t.classList.toggle('on',!!ST[t.dataset.k]));$$('.sw').forEach(w=>w.classList.toggle('on',w.dataset.s===s.id));if($('#styleName'))$('#styleName').textContent=s.name;if($('#secCount'))$('#secCount').textContent=`Secrets found: ${ST.codes.length} / ${SECRETS.length}`;
 if(typeof alUI==='function'&&$('#alH'))alUI();if(master)master.gain.value=ST.vol;$('#testScare').style.display=ST.scares?'':'none';}

/* ---------- secrets / easter eggs ---------- */
const SECRETS=['damballa','wannaplay','hideyho','tiffany','charles','1988','killer','friends','lakeshore','hackensack','voodoo','konami','poke7','date13','crown5','ritual','shake','flash'];
function found(k){if(!ST.codes.includes(k)){ST.codes.push(k);save();applySettings();setTimeout(()=>toast(`Secret found (${ST.codes.length}/${SECRETS.length}). Nice work, detective.`,{save:false,from:'Easter egg'}),2200);}}
function secret(k){if(k==='date13'){say("Friday the 13th? Wrong franchise, pal.");found(k);}if(k==='crown5'){say("Quit spinning me! I'm gonna hurl!");$('#watch').classList.add('shake');setTimeout(()=>$('#watch').classList.remove('shake'),400);found(k);}}
function checkCode(raw){const c=raw.toLowerCase().replace(/[^a-z0-9]/g,'');const A={
 damballa:()=>{go(idx('ritual'));setTimeout(startRitual,500);},wannaplay:()=>say("Hi, I'm Chucky. Wanna play?",{evil:false}),hideyho:()=>laugh(),tiffany:()=>setStyle('bride'),
 charles:()=>say("Charles Lee Ray. Friends call me Chucky. You can call me Charles, Nick. You earned it."),'1988':()=>{say("November 9th, 1988. My big debut. Ha!");confetti();},
 killer:()=>{setMood(100);say("Now we're cookin'!",{evil:true});},friends:()=>{setMood(0);FX.ritualEvil=false;say("Friends till the end!",{evil:false});},lakeshore:()=>{go(idx('world'));say("Chicago. The Lakeshore. Good times. For me.");},
 hackensack:()=>setStyle('hack'),voodoo:()=>setStyle('voodoo'),goodguys:()=>setStyle('goodguys')};
 if(A[c]){A[c]();if(SECRETS.includes(c))found(c);return true;}return false;}
function confetti(){const f=document.createElement('canvas');f.width=400;f.height=400;f.style.cssText='position:absolute;inset:0;z-index:44;pointer-events:none';inner.appendChild(f);const g=f.getContext('2d');const P=Array.from({length:90},()=>({x:200,y:200,vx:(Math.random()-.5)*9,vy:-Math.random()*9-2,c:rnd(['#e8262d','#ffd400','#27b24a','#2468d8','#fff']),r:Math.random()*6}));let n=0;
 (function st(){g.clearRect(0,0,400,400);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.r+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-4,-2,8,4);g.restore();});if(++n<120)requestAnimationFrame(st);else f.remove();})();SFX.chime();}
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let kseq=[],kbuf='';

/* ---------- input ---------- */
function initInput(){
 const disp=$('#display');let sx=0,sy=0,st=0,noswipe=false;
 disp.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=performance.now();noswipe=!!e.target.closest('[data-noswipe],input');audio();});
 disp.addEventListener('pointerup',e=>{if(noswipe)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4&&performance.now()-st<800&&!modalOpen()){if(inner.classList.contains('launch'))return;nav(dx<0?1:-1);}});
 disp.addEventListener('wheel',e=>{const sc=e.target.closest('.scroll');if(sc&&sc.scrollHeight>sc.clientHeight+2)return;e.preventDefault();wheelNav(e.deltaY||e.deltaX);},{passive:false});
 const cr=$('#crown');let cy=null,acc=0,moved=false;
 cr.addEventListener('pointerdown',e=>{cy=e.clientY;acc=0;moved=false;cr.setPointerCapture(e.pointerId);audio();});
 cr.addEventListener('pointermove',e=>{if(cy==null)return;const d=e.clientY-cy;cy=e.clientY;acc+=d;if(Math.abs(acc)>26){moved=true;nav(acc>0?1:-1);acc=0;}});
 cr.addEventListener('pointerup',()=>{if(cy!=null&&!moved)crownPress();cy=null;});
 cr.addEventListener('wheel',e=>{e.preventDefault();wheelNav(e.deltaY);},{passive:false});
 $('#pushTop').onclick=()=>{audio();SFX.tick();if(SCREENS[cur].id!=='talk')go(idx('talk'));setTimeout(talkRandom,300);};
 $('#pushBot').onclick=()=>{audio();SFX.tick();laugh();};
 $('#toast').onclick=()=>{$('#toast').classList.remove('show');go(idx('texts'));};
 window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;audio();
  kseq.push(e.key);kseq=kseq.slice(-10);if(kseq.join()===KONAMI.join()){kseq=[];konami();return;}
  if(e.key==='ArrowRight'){nav(1);e.preventDefault();}else if(e.key==='ArrowLeft'){nav(-1);e.preventDefault();}
  else if(e.key==='Enter'||e.key==='Escape'){if(modalOpen()){const b=$('#modalBtns .btn:last-child');b&&b.click();}else crownPress();}
  else if(e.key.length===1){kbuf=(kbuf+e.key.toLowerCase()).slice(-14);for(const c of ['damballa','wannaplay','hideyho','tiffany','charles','1988','killer','friends','lakeshore','hackensack','voodoo','goodguys'])if(kbuf.endsWith(c)){kbuf='';checkCode(c);return;}
   if(e.key==='t'&&performance.now()-(window._lk||0)>900)talkRandom();}window._lk=performance.now();});
 window.addEventListener('pointermove',e=>{LOOK.x=e.clientX;LOOK.y=e.clientY;LOOK.t=performance.now();});
 window.addEventListener('deviceorientation',onOrient);
 document.addEventListener('scroll',e=>{const el=e.target;if(el&&el.nodeType===1&&(el.id==='display'||el.id==='inner'||el.id==='screens'||el.id==='stage'||el.classList.contains('scr')||el.classList.contains('watch'))){el.scrollLeft=0;el.scrollTop=0;}},true);
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis' in window)speechSynthesis.cancel();});}
function wheelNav(d){const t=performance.now();if(t-CROWN.wheelAt<260||Math.abs(d)<4)return;CROWN.wheelAt=t;nav(d>0?1:-1);}
function konami(){found('konami');say("Up up down down? Ha! I invented cheating, pal.");const h=$('#faceHead');h.style.transition='transform 1.2s';h.style.transformOrigin='200px 110px';h.style.transform='rotate(720deg)';setTimeout(()=>{h.style.transition='';h.style.transform='';},1300);confetti();}
const LOOK={x:0,y:0,t:0};

/* ---------- main loop ---------- */
let lastT=performance.now(),lastSec=-1,nextText=performance.now()+25000;
function loop(t){const dt=Math.min(100,t-lastT);lastT=t;const d=now();
 const id=SCREENS[cur].id,launch=inner.classList.contains('launch');const ev=isEvil(),mv=moodVal();document.body.classList.toggle('evil',ev);
 // eye tracking targets
 const vis=[];if(!launch){if(id==='face')vis.push(faceHead);if(id==='talk')vis.push(talkHead);if(id==='soul')vis.push(soulHead);}if(modalOpen())vis.push(modalHead);if($('#scare').classList.contains('show'))vis.push(scareHead);
 vis.forEach(h=>{if(!h)return;h.setEvil(h===soulHead?ST.mood>=60:(h===modalHead||h===scareHead?true:ev));h.mood=h===soulHead?ST.mood/100:(h===modalHead||h===scareHead?.95:mv);
  if(ORI&&t-ORI.t<1500&&t-LOOK.t>1500){h.lookT=[clamp(ORI.g/30,-1,1),clamp((ORI.b-45)/30,-1,1)];}
  else if(t-LOOK.t<4000){const [cx,cy]=h.eyeCenter();h.lookT=[clamp((LOOK.x-cx)/260,-1,1),clamp((LOOK.y-cy)/220,-1,1)];}
  else h.lookT=[Math.sin(t/1700)*.6,Math.sin(t/2300)*.35];
  h.surprise=Math.max(0,h.surprise-dt*.003);h.glow=h===scareHead?.9:(FX.ritualEvil||FX.witching?.35+.25*Math.sin(t/300):0);h.update(t);});
 if(id==='face'&&!launch)updateFace(t,d);
 if(!launch&&TICK[id])TICK[id](t,dt,d);
 if(id!=='face'&&!launch){const mt=SCREENS[cur].el.querySelector('.mini-time');if(mt)mt.textContent=fmtTime(d).replace(/ (AM|PM)/,'');}
 if(TM.run&&id==='timer')drawTimer();
 vitalsTick(dt);drawRain();
 if(d.getSeconds()!==lastSec){lastSec=d.getSeconds();everySecond(d);}
 if(ST.texts&&t>nextText&&!modalOpen()&&!document.hidden){nextText=t+70000+Math.random()*90000;const h=d.getHours();let msg=rnd(LINES.texts);if(h>=23||h<5)msg=rnd(["It's late, Nick. Go to sleep. I'll watch you. I mean watch OVER you.","Can't sleep? Me neither. I don't have eyelids that close all the way."]);toast(msg);}
 requestAnimationFrame(loop);}
function everySecond(d){timerCheck();alarmCheck(d);
 const w=isWitching(d);if(w&&!FX.witching){FX.witching=true;lightning(1.2);setTimeout(()=>{say(rnd(LINES.witching),{evil:true});toast(d.getHours()===0?"Midnight. The witching hour. Heh heh heh.":"3 AM. The dead hour. I'm wide awake, pal.");},900);}
 else if(!w&&FX.witching){FX.witching=false;}
 if(FX.witching&&Math.random()<.04)lightning(.5);
 const h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
 if(s===0&&h%12===3&&m===33&&!everySecond.k333){everySecond.k333=1;toast('3:33. Make a wish. Mine involves a knife.');}if(m!==33)everySecond.k333=0;
 if(s===0&&m===0&&!w&&ST.sound&&!document.hidden&&everySecond.lastH!==h){everySecond.lastH=h;SFX.music();}}

/* ---------- sizing ---------- */
function resize(){const vw=innerWidth,vh=innerHeight;const mobile=vw<600;let C=mobile?Math.min(vw*.95,vh*.62):Math.min(vw*.62,vh*.8,640);C=Math.max(240,C);
 document.documentElement.style.setProperty('--C',C+'px');document.documentElement.style.setProperty('--s',(C*400/480/400).toFixed(4));}

/* ---------- boot ---------- */
function boot(){resize();addEventListener('resize',resize);
 let lugs='';[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{const x=240+sx*96,y=240+sy*200;lugs+=`<path d="M${x-sx*16} ${y} L${x+sx*16} ${y} L${x+sx*14} ${y+sy*60} Q${x} ${y+sy*68} ${x-sx*13} ${y+sy*58}Z" fill="url(#caseG)" stroke="#3a3c42" stroke-width="1.5"/>`;});$('#lugs').innerHTML=lugs;
 let bt='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0;const r0=big?225:228.5;if(!((i>=11&&i<=19)||(i>=41&&i<=49)))continue;bt+=`<line x1="${(240+r0*Math.sin(a)).toFixed(1)}" y1="${(240-r0*Math.cos(a)).toFixed(1)}" x2="${(240+232.5*Math.sin(a)).toFixed(1)}" y2="${(240-232.5*Math.cos(a)).toFixed(1)}" style="stroke:var(--bezTxt)" stroke-width="${big?2.4:1}" opacity="${big?.9:.5}"/>`;}
 $('#bezTicks').innerHTML=bt;
 buildScreens();toastHead=makeChucky($('#toastHead'),{lite:true,viewBox:'150 150 180 180'});applySettings();initInput();
 FX.witching=isWitching();
 setTimeout(()=>{toast(ST.boots>1?rnd(["Welcome back, Nick. I kept your wrist warm.","Nick! You came back! I knew you would."]):"Hey Nick! It's me, Charles. Strap me on. Let's have some fun.");},2500);
 requestAnimationFrame(loop);
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 window.chuckyWatch={ST,go,nav,idx,SCREENS,say,lightning,jumpScare,startRitual,banish,setStyle,setMood,checkCode,ringAlarm,stopRing,crownPress,
  setTime:s=>{const [h,m,sec]=s.split(':').map(Number);const d=new Date();d.setHours(h,m,sec||0,0);tOff=d-Date.now();},FX,VIT,toast,isEvil};}
boot();

</script>
</body></html>
