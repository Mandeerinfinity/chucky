<script>'use strict';

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const METALS={
 silver:{n:'Mirror Steel',d:'#23262b',m:'#8a9099',l:'#e2e7ed',h:'#ffffff'},
 gold:{n:'18k Gold',d:'#3a2303',m:'#b07f22',l:'#f3d27e',h:'#fff7dc'},
 rose:{n:'Rose Gold',d:'#3b170f',m:'#b06a55',l:'#f3c0ab',h:'#fff3ee'},
 black:{n:'Blackened Steel',d:'#020203',m:'#202126',l:'#5a5e68',h:'#dfe3ec'},
 bloody:{n:'Bloody Steel',d:'#140103',m:'#6a0910',l:'#c62f39',h:'#ffd0d0',blood:1}};
const DIALS={enamel:'Grand Feu Enamel',denim:'Good Guys Denim',stripes:'Shirt Stripes',red:'Blood Sunburst',onyx:'Black Onyx'};
const FONTS={script:'"Snell Roundhand","Apple Chancery","Zapfino","URW Chancery L","Segoe Script","Brush Script MT","Noto Serif",cursive',
 roman:'Didot,"Bodoni 72","Times New Roman","Noto Serif",Georgia,serif',gothic:'"Old English Text MT",Luminari,"Apple Chancery","UnifrakturMaguntia","Noto Serif",fantasy'};

function cv(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h||w));return c;}
function toURL(c){return new Promise(r=>{try{c.toBlob(b=>r(b?URL.createObjectURL(b):c.toDataURL()),'image/png');}catch(e){r(c.toDataURL());}});}
function setImg(img,url){if(!img)return;const o=img.dataset.u;img.src=url;img.dataset.u=url;if(o&&o.startsWith('blob:')&&o!==url&&!$$('img').some(i=>i!==img&&i.dataset.u===o))setTimeout(()=>URL.revokeObjectURL(o),3000);}
function rr(x,X,Y,w,h,r){x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function stops(g,a){a.forEach(s=>g.addColorStop(s[0],s[1]));return g;}
function conic(x,a0,cx,cy,a){const g=x.createConicGradient?x.createConicGradient(a0,cx,cy):x.createLinearGradient(0,0,cx*2,cy*2);return stops(g,a);}
function polish(M,alt){return alt?[[0,M.l],[.07,M.d],[.15,M.m],[.24,M.h],[.29,M.l],[.4,M.d],[.47,M.m],[.56,M.h],[.6,M.l],[.72,M.d],[.8,M.m],[.88,M.h],[.93,M.l],[1,M.l]]
 :[[0,M.m],[.05,M.h],[.1,M.l],[.19,M.d],[.28,M.m],[.355,M.h],[.39,M.l],[.5,M.d],[.6,M.m],[.665,M.h],[.7,M.l],[.82,M.d],[.92,M.l],[1,M.m]];}
function ring(x,C,r0,r1){x.beginPath();x.arc(C,C,r1,0,TAU);x.arc(C,C,r0,0,TAU,true);}
function arcS(x,C,r,a0,a1,lw,col){x.beginPath();x.arc(C,C,r,a0*Math.PI,a1*Math.PI);x.lineWidth=lw;x.strokeStyle=col;x.stroke();}
function cylG(x,x0,y0,x1,y1,M){return stops(x.createLinearGradient(x0,y0,x1,y1),[[0,M.d],[.16,M.m],[.36,M.h],[.5,M.l],[.74,M.m],[1,M.d]]);}
function beads(x,C,r,n,s,M){for(let i=0;i<n;i++){const a=i/n*TAU,bx=C+Math.cos(a)*r,by=C+Math.sin(a)*r;const g=x.createRadialGradient(bx-s*.4,by-s*.4,0,bx,by,s*1.1);g.addColorStop(0,M.h);g.addColorStop(.55,M.m);g.addColorStop(1,M.d);x.fillStyle=g;x.beginPath();x.arc(bx,by,s,0,TAU);x.fill();}}
function shade(x,C,r0,r1,a){const g=x.createRadialGradient(C,C,r0,C,C,r1);stops(g,a);x.fillStyle=g;x.fill();}
function seeded(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function bloodSplat(x,C,R,r0,r1,seed){const r=seeded(seed);
 for(let i=0;i<30;i++){const a=r()*TAU,d=R*(r0+r()*(r1-r0)),bx=C+Math.cos(a)*d,by=C+Math.sin(a)*d,rad=R*(.006+r()*r()*.045);x.fillStyle=`rgba(${60+r()*50|0},0,4,${.8+r()*.18})`;x.beginPath();x.arc(bx,by,rad,0,TAU);x.fill();
  if(r()<.55){x.beginPath();x.moveTo(bx-rad*.7,by);x.quadraticCurveTo(bx,by+rad*(2+r()*7),bx+rad*.7,by);x.fill();}
  x.fillStyle='rgba(255,210,210,.6)';x.beginPath();x.arc(bx-rad*.35,by-rad*.35,rad*.22,0,TAU);x.fill();}}
/* engraving: light lip offset first, then dark groove on top */
function engr(x,o,draw,a1=.55,a2=.6){x.save();x.translate(o,o*1.2);draw('rgba(255,255,255,'+a1+')',1);x.restore();x.save();draw('rgba(0,0,0,'+a2+')',0);x.restore();}
function arcText(x,C,r,text,size,font,o){x.save();x.textAlign='center';x.textBaseline='middle';let sz=size;x.font=`${sz}px ${font}`;
 const chars=[...text];let ws=chars.map(ch=>x.measureText(ch).width+sz*.22);let tot=ws.reduce((a,b)=>a+b,0);const circ=TAU*r*.98;
 if(tot>circ){sz=sz*circ/tot;x.font=`${sz}px ${font}`;ws=chars.map(ch=>x.measureText(ch).width+sz*.22);tot=ws.reduce((a,b)=>a+b,0);}
 const sp=(circ-tot)/chars.length;let a=-Math.PI/2-(ws[0]+sp)/r/2;
 chars.forEach((ch,i)=>{const w=ws[i]+sp,am=a+w/2/r;x.save();x.translate(C+Math.cos(am)*r,C+Math.sin(am)*r);x.rotate(am+Math.PI/2);engr(x,o,col=>{x.fillStyle=col;x.fillText(ch,0,0);});x.restore();a+=w/r;});x.restore();}

/* ---------- case band (front & back share it) ---------- */
function drawCase(M,px){const c=cv(px),x=c.getContext('2d'),C=px/2,R=px/2.12;
 const ky=C+R*.99,kh=R*.09;[[-.21,-.075],[-.066,.066],[.075,.21]].forEach(([a,b])=>{x.beginPath();rr(x,C+a*R,ky-kh/2,(b-a)*R-1,kh,kh*.4);x.fillStyle=cylG(x,0,ky-kh/2,0,ky+kh/2,M);x.fill();x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=R*.004;x.stroke();});
 x.beginPath();x.arc(C,C,R,0,TAU);x.fillStyle=conic(x,-Math.PI/2+.35,C,C,polish(M));x.fill();
 shade(x,C,R*.8,R,[[0,'rgba(0,0,0,.65)'],[.1,'rgba(255,255,255,.32)'],[.3,'rgba(255,255,255,.08)'],[.62,'rgba(0,0,0,.02)'],[.88,'rgba(0,0,0,.32)'],[1,'rgba(0,0,0,.78)']]);
 x.save();x.lineCap='round';x.shadowColor='rgba(255,255,255,.95)';x.shadowBlur=R*.035;
 arcS(x,C,R*.92,1.05,1.42,R*.032,'rgba(255,255,255,.7)');arcS(x,C,R*.952,1.13,1.33,R*.012,'rgba(255,255,255,1)');arcS(x,C,R*.925,.1,.32,R*.022,'rgba(255,255,255,.32)');arcS(x,C,R*.9,1.62,1.7,R*.014,'rgba(255,255,255,.5)');x.restore();
 ring(x,C,R*.795,R*.868);x.fillStyle=conic(x,Math.PI/2+.25,C,C,polish(M,1));x.fill();
 ring(x,C,R*.795,R*.868);shade(x,C,R*.795,R*.868,[[0,'rgba(0,0,0,.6)'],[.22,'rgba(255,255,255,.22)'],[.6,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,.65)']]);
 beads(x,C,R*.884,150,R*.0085,M);
 x.save();x.lineCap='round';x.shadowColor='#fff';x.shadowBlur=R*.02;arcS(x,C,R*.835,1.12,1.36,R*.012,'rgba(255,255,255,.85)');arcS(x,C,R*.83,.15,.28,R*.008,'rgba(255,255,255,.4)');x.restore();
 if(M.blood)bloodSplat(x,C,R,.8,.99,77);
 x.globalCompositeOperation='destination-out';x.beginPath();x.arc(C,C,R*.796,0,TAU);x.fill();x.globalCompositeOperation='source-over';
 x.beginPath();x.arc(C,C,R*.797,0,TAU);shade(x,C,R*.70,R*.797,[[0,'rgba(0,0,0,0)'],[.7,'rgba(0,0,0,.18)'],[1,'rgba(0,0,0,.6)']]);
 return c;}
function drawShadow(px){const c=cv(px*1.3),x=c.getContext('2d'),C=px*.65;x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=px*.07;x.shadowOffsetX=px*20;x.fillStyle='#000';x.beginPath();x.arc(C-px*20,C,px*.47,0,TAU);x.fill();
 x.beginPath();x.ellipse(C-px*20,C-px*.55,px*.17,px*.1,0,0,TAU);x.lineWidth=px*.04;x.strokeStyle='#000';x.stroke();return c;}
/* ---------- bow + pendant (u = watch diameter in px) ---------- */
function drawTop(M,u){const w=u*.44,h=u*.345,c=cv(w,h),x=c.getContext('2d'),X=w/2;
 const by=u*.105,rx=u*.165,ry=u*.093;
 x.lineCap='round';x.beginPath();x.ellipse(X,by,rx,ry,0,0,TAU);x.lineWidth=u*.042;x.strokeStyle=M.d;x.stroke();
 x.beginPath();x.ellipse(X,by,rx,ry,0,0,TAU);x.lineWidth=u*.031;x.strokeStyle=stops(x.createLinearGradient(0,by-ry,0,by+ry),[[0,M.h],[.25,M.l],[.5,M.m],[.75,M.l],[1,M.d]]);x.stroke();
 x.beginPath();x.ellipse(X,by,rx-u*.006,ry-u*.006,0,Math.PI*1.05,Math.PI*1.95);x.lineWidth=u*.008;x.strokeStyle='rgba(255,255,255,.95)';x.shadowColor='#fff';x.shadowBlur=u*.01;x.stroke();x.shadowBlur=0;
 x.beginPath();x.ellipse(X,by,rx+u*.008,ry+u*.008,0,Math.PI*.15,Math.PI*.85);x.lineWidth=u*.005;x.strokeStyle='rgba(255,255,255,.35)';x.stroke();
 // pendant neck + collar
 x.beginPath();x.moveTo(X-u*.055,u*.25);x.lineTo(X+u*.055,u*.25);x.lineTo(X+u*.085,h);x.lineTo(X-u*.085,h);x.closePath();x.fillStyle=cylG(x,X-u*.085,0,X+u*.085,0,M);x.fill();
 x.fillStyle='rgba(0,0,0,.35)';x.fillRect(X-u*.085,h-u*.012,u*.17,u*.012);
 x.beginPath();rr(x,X-u*.07,u*.238,u*.14,u*.022,u*.008);x.fillStyle=cylG(x,X-u*.07,0,X+u*.07,0,M);x.fill();
 if(M.blood){x.fillStyle='rgba(90,0,6,.85)';x.beginPath();x.arc(X+u*.03,u*.29,u*.012,0,TAU);x.fill();}
 return c;}
function drawCrown(M,u){const w=u*.2,h=u*.1,c=cv(w,h),x=c.getContext('2d');
 x.beginPath();rr(x,1,h*.08,w-2,h*.84,h*.22);x.fillStyle=cylG(x,0,0,w,0,M);x.fill();
 for(let i=1;i<30;i++){const X=i*w/30;x.fillStyle=i%2?'rgba(0,0,0,.38)':'rgba(255,255,255,.28)';x.fillRect(X,h*.16,w/60,h*.68);}
 x.fillStyle=stops(x.createLinearGradient(0,0,0,h),[[0,'rgba(255,255,255,.75)'],[.18,'rgba(255,255,255,0)'],[.8,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.6)']]);x.beginPath();rr(x,1,h*.08,w-2,h*.84,h*.22);x.fill();
 x.beginPath();rr(x,1,h*.08,w-2,h*.84,h*.22);x.lineWidth=Math.max(1,u*.003);x.strokeStyle='rgba(0,0,0,.5)';x.stroke();return c;}
/* ---------- hunter lid: front (engraved) and inside (inscription) ---------- */
function drawLid(M,px,inside,E){const c=cv(px),x=c.getContext('2d'),C=px/2,R=px/2-1,o=Math.max(1,px/700);
 x.beginPath();x.arc(C,C,R,0,TAU);x.fillStyle=conic(x,inside?1.3:-.9,C,C,polish(M,inside));x.fill();
 if(!inside){x.beginPath();x.arc(C,C,R,0,TAU);const g=x.createRadialGradient(C-R*.3,C-R*.34,R*.02,C,C,R*1.02);stops(g,[[0,'rgba(255,255,255,.6)'],[.2,'rgba(255,255,255,.16)'],[.55,'rgba(0,0,0,.04)'],[.9,'rgba(0,0,0,.42)'],[1,'rgba(0,0,0,.72)']]);x.fillStyle=g;x.fill();}
 else{x.beginPath();x.arc(C,C,R,0,TAU);shade(x,C,0,R,[[0,'rgba(0,0,0,.28)'],[.55,'rgba(255,255,255,.06)'],[.86,'rgba(255,255,255,.3)'],[1,'rgba(0,0,0,.65)']]);}
 ring(x,C,R*.9,R);x.fillStyle=conic(x,inside?-.4:2.2,C,C,polish(M,!inside));x.fill();
 ring(x,C,R*.9,R);shade(x,C,R*.9,R,[[0,'rgba(0,0,0,.6)'],[.2,'rgba(255,255,255,.3)'],[.55,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,.75)']]);
 if(!inside)beads(x,C,R*.9,130,R*.008,M);
 if(!inside)engraveFront(x,C,R,M,E,o);else engraveInside(x,C,R,M,E,o);
 x.save();x.lineCap='round';x.shadowColor='#fff';x.shadowBlur=R*.03;arcS(x,C,R*.95,1.08,1.38,R*.02,'rgba(255,255,255,.85)');arcS(x,C,R*.95,.12,.26,R*.012,'rgba(255,255,255,.35)');x.restore();
 if(!inside){const g=x.createRadialGradient(C-R*.38,C-R*.42,0,C-R*.38,C-R*.42,R*.28);stops(g,[[0,'rgba(255,255,255,.75)'],[.4,'rgba(255,255,255,.18)'],[1,'rgba(255,255,255,0)']]);x.fillStyle=g;x.beginPath();x.arc(C,C,R,0,TAU);x.fill();}
 if(M.blood)bloodSplat(x,C,R,inside?.5:.2,.97,inside?13:31);
 return c;}
function knifeOutline(x,len,w){x.beginPath();x.moveTo(0,-len);x.quadraticCurveTo(-w*1.3,-len*.5,-w,-len*.18);x.lineTo(w*.6,-len*.18);x.lineTo(w*.35,-len*.95);x.closePath();x.rect(-w*1.25,-len*.18,w*2.1,len*.05);x.rect(-w,-len*.13,w*1.6,len*.4);}
function engraveFront(x,C,R,M,E,o){
 // guilloche barleycorn field
 for(let k=0;k<46;k++){const r0=R*.44+k*(R*.33/46);x.beginPath();for(let i=0;i<=420;i++){const a=i/420*TAU,r=r0+R*.0075*Math.sin(a*60+k*.85);i?x.lineTo(C+Math.cos(a)*r,C+Math.sin(a)*r):x.moveTo(C+Math.cos(a)*r,C+Math.sin(a)*r);}
  engr(x,o*.7,col=>{x.strokeStyle=col;x.lineWidth=o*1.1;x.stroke();},.35,.42);}
 // cartouche
 [R*.425,R*.41,R*.775,R*.79].forEach((r,i)=>engr(x,o,col=>{x.beginPath();x.arc(C,C,r,0,TAU);x.strokeStyle=col;x.lineWidth=o*(i%2?1.2:2.2);x.stroke();}));
 for(let i=0;i<24;i++){const a=i/24*TAU;engr(x,o,col=>{x.beginPath();x.arc(C+Math.cos(a)*R*.395,C+Math.sin(a)*R*.395,R*.012,0,TAU);x.fillStyle=col;x.fill();});}
 // rainbow arcs (Good Guys motif)
 for(let i=0;i<4;i++)engr(x,o,col=>{x.beginPath();x.arc(C,C-R*.06,R*(.3-i*.03),Math.PI*1.18,Math.PI*1.82);x.strokeStyle=col;x.lineWidth=o*2;x.stroke();},.45,.5);
 // crossed knives, very subtle
 [-.62,.62].forEach(a=>{x.save();x.translate(C,C+R*.05);x.rotate(a);engr(x,o,col=>{knifeOutline(x,R*.36,R*.03);x.strokeStyle=col;x.lineWidth=o*1.4;x.stroke();},.25,.32);x.restore();});
 // monogram
 x.save();x.textAlign='center';x.textBaseline='middle';const mono=(E.mono||'GG').slice(0,4);x.font=`italic 700 ${R*(mono.length>2?.21:.29)}px ${FONTS[E.font]||FONTS.script}`;
 engr(x,o*2,col=>{x.fillStyle=col;x.fillText(mono,C,C+R*.07);},.6,.62);
 x.font=`600 ${R*.05}px ${SERIF}`;engr(x,o,col=>{x.fillStyle=col;x.fillText('C · L · R',C,C+R*.28);});x.restore();
 arcText(x,C,R*.835,(E.arc||'').toUpperCase().slice(0,64)||'GOOD GUYS ✦ FRIEND TO THE END ✦',R*.062,`600 ${'Didot,"Times New Roman","Noto Serif",serif'}`,o);}
function engraveInside(x,C,R,M,E,o){const f=FONTS[E.font]||FONTS.script;x.save();x.textAlign='center';x.textBaseline='middle';
 const L=[[E.l1,.12,-.2],[E.l2,.135,0],[E.l3,.075,.2]];
 L.forEach(([t,s,dy])=>{if(!t)return;x.font=`italic ${R*s}px ${f}`;let w=x.measureText(t).width;if(w>R*1.3)x.font=`italic ${R*s*R*1.3/w}px ${f}`;engr(x,o*1.4,col=>{x.fillStyle=col;x.fillText(t.slice(0,30),C,C+R*dy);},.6,.66);});
 [-1,1].forEach(sg=>engr(x,o,col=>{x.beginPath();x.moveTo(C-R*.42,C+R*.1*sg);x.bezierCurveTo(C-R*.15,C+R*.06*sg,C+R*.15,C+R*.14*sg,C+R*.42,C+R*.1*sg);x.strokeStyle=col;x.lineWidth=o*1.3;x.stroke();x.beginPath();x.arc(C+R*.43,C+R*.1*sg-R*.015,R*.015,0,TAU);x.stroke();x.beginPath();x.arc(C-R*.43,C+R*.1*sg-R*.015,R*.015,0,TAU);x.stroke();}));
 x.save();x.translate(C,C+R*.5);x.rotate(Math.PI/2);engr(x,o,col=>{knifeOutline(x,R*.16,R*.018);x.strokeStyle=col;x.lineWidth=o;x.stroke();},.3,.4);x.restore();
 x.restore();arcText(x,C,R*.82,'NO. 1988 ✦ HACKENSACK N.J. ✦ ADE DUE DAMBALLA ✦ GOOD GUYS ✦ ',R*.045,`600 ${SERIF}`,o);}
/* ---------- chain tile ---------- */
function drawChain(M,w){const h=w*1.8,c=cv(w,h),x=c.getContext('2d'),X=w/2;
 x.beginPath();rr(x,X-w*.11,h*.5,w*.22,h*.56,w*.11);x.fillStyle=cylG(x,X-w*.11,0,X+w*.11,0,M);x.fill();x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=1;x.stroke();

 const ey=h*.27,erx=w*.34,ery=h*.25;x.beginPath();x.ellipse(X,ey,erx,ery,0,0,TAU);x.lineWidth=w*.17;x.strokeStyle=M.d;x.stroke();

 x.beginPath();x.ellipse(X,ey,erx-w*.015,ery-w*.015,0,Math.PI*1.0,Math.PI*1.6);x.lineWidth=w*.035;x.strokeStyle='rgba(255,255,255,.95)';x.stroke();
 if(M.blood&&Math.random()<1){x.fillStyle='rgba(90,0,6,.8)';x.beginPath();x.arc(X+erx*.8,ey+ery*.4,w*.06,0,TAU);x.fill();}

/* ---------- environment map (moving reflections on the case) ---------- */
function drawEnv(px){const c=cv(px),x=c.getContext('2d'),C=px/2;x.shadowColor='#fff';
 const blobs=[[-.62,.9,.24,.22,.95],[-.95,.86,.1,.3,.7],[.55,.88,.14,.08,.55],[1.5,.9,.3,.06,.35],[2.6,.88,.12,.12,.5],[-1.9,.9,.07,.2,.4]];
 blobs.forEach(([a,d,w,hh,al])=>{x.save();x.translate(C+Math.cos(a)*C*d,C+Math.sin(a)*C*d);x.rotate(a+Math.PI/2);x.shadowBlur=px*.03;x.fillStyle=`rgba(255,255,255,${al})`;x.fillRect(-C*w/2,-C*hh/2,C*w,C*hh);x.restore();});

const AU={ctx:null,bus:{},next:0,tock:false,noise:null,rain:null,drone:null};
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx;}const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
 try{if(navigator.audioSession&&ST.silent)navigator.audioSession.type='playback';}catch(e){}
 const c=AU.ctx=new A();AU.master=c.createGain();AU.master.connect(c.destination);['tick','chime','music','voice','fx','amb'].forEach(k=>{const g=c.createGain();g.connect(AU.master);AU.bus[k]=g;});mixApply();
 const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
 const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,c.sampleRate);s.connect(c.destination);s.start();AU.next=c.currentTime+.1;return c;}
function mixApply(){if(!AU.ctx)return;const m=ST.mix;AU.master.gain.value=m.master;Object.keys(AU.bus).forEach(k=>AU.bus[k].gain.value=m[k]!=null?m[k]:1);}
function nz(t,dur,f,q,vol,bus,type='bandpass'){const c=AU.ctx;if(!c)return;const s=c.createBufferSource();s.buffer=AU.noise;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(AU.bus[bus]);s.start(t,Math.random()*1.5);s.stop(t+dur+.02);}
function osc(t,f,dur,vol,bus,type='sine',f2){const c=AU.ctx;if(!c)return;const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.bus[bus]);o.start(t);o.stop(t+dur+.05);}

function tickPump(){const c=AU.ctx;if(!c||c.state!=='running'||document.hidden||!running()||ST.mix.tick<=0){if(c)AU.next=c.currentTime+.1;return;}
 if(AU.next<c.currentTime)AU.next=c.currentTime+.05;while(AU.next<c.currentTime+.25){tickAt(AU.next,AU.tock);AU.tock=!AU.tock;AU.next+=.2;}}
function bell(t,f,vol=.5,dur=2.6,bus='chime'){const P=[[1,1],[2.01,.5],[2.76,.36],[5.43,.18],[8.93,.08]];P.forEach(([k,a],i)=>osc(t,f*k,dur/(1+i*.55),vol*a,bus));nz(t,.05,f*3,2,vol*.3,bus);}
function gong(t,f,vol=.6){[[1,1],[1.5,.25],[2.0,.4],[2.98,.2],[4.1,.08]].forEach(([k,a],i)=>osc(t,f*k,3.2/(1+i*.4),vol*a,'chime'));nz(t,.08,f*2,1.5,vol*.25,'chime','lowpass');}
function sfx(k){const c=audioInit();if(!c)return;const t=c.currentTime+.01;
 if(k==='lid'){nz(t,.03,4000,1,.7,'fx','highpass');osc(t,2200,.12,.15,'fx');nz(t+.04,.05,1500,3,.35,'fx');}
 else if(k==='close'){nz(t,.04,2600,1,.8,'fx','highpass');osc(t,1700,.18,.18,'fx');osc(t,180,.1,.3,'fx');}
 else if(k==='ratchet'){nz(t,.012,5200+Math.random()*900,6,.45,'fx');osc(t,3000,.02,.05,'fx');}
 else if(k==='press'){nz(t,.025,2000,2,.45,'fx');osc(t,900,.05,.08,'fx');}
 else if(k==='tap'){osc(t,1400,.05,.08,'fx','triangle');}
 else if(k==='trophy'){[784,988,1175,1568].forEach((f,i)=>bell(t+i*.11,f,.18,1.2,'fx'));}
 else if(k==='flip'){nz(t,.35,900,1,.25,'fx');osc(t,300,.3,.08,'fx','sine',600);}

 else if(k==='scare'){osc(t,1800,.9,.5,'fx','sawtooth',160);osc(t,1300,.9,.4,'fx','square',120);nz(t,.9,2500,.5,.6,'fx');}

function repeater(d){const c=audioInit();const h=d.getHours()%12||12,m=d.getMinutes(),q=Math.floor(m/15),mm=m%15;let t=(c?c.currentTime:0)+.15;const ev=[];
